name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and local integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile project modules
        run: python -m compileall -q flows domains tests scripts

      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v

  external-integration:
    name: External S3 and PostgreSQL integration
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: unit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nooshare
          POSTGRES_PASSWORD: nooshare_ci_test
          POSTGRES_DB: nooshare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nooshare -d nooshare_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NOOSHARE_S3_BUCKET: ${{ vars.NOOSHARE_S3_BUCKET || 'raw' }}
      NOOSHARE_S3_OBJECT: ${{ vars.NOOSHARE_S3_OBJECT || 'meta1' }}
      NOOSHARE_PG_HOST: localhost
      NOOSHARE_PG_PORT: "5432"
      NOOSHARE_PG_USER: nooshare
      NOOSHARE_PG_PASSWORD: nooshare_ci_test
      NOOSHARE_PG_DATABASE: nooshare_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install external integration dependencies
        run: python -m pip install boto3 psycopg2-binary

      - name: Test current JQ domain flow against S3 and PostgreSQL
        env:
          NOOSHARE_S3_ENDPOINT: ${{ secrets.NOOSHARE_S3_ENDPOINT }}
          NOOSHARE_S3_ACCESS_KEY: ${{ secrets.NOOSHARE_S3_ACCESS_KEY }}
          NOOSHARE_S3_SECRET_KEY: ${{ secrets.NOOSHARE_S3_SECRET_KEY }}
        run: python scripts/integration/jq_s3_to_pg.py

      - name: Test Tong extraction, GBBQ decryption, adjustment, and PostgreSQL
        env:
          NOOSHARE_S3_ENDPOINT: ${{ secrets.NOOSHARE_S3_ENDPOINT }}
          NOOSHARE_S3_ACCESS_KEY: ${{ secrets.NOOSHARE_S3_ACCESS_KEY }}
          NOOSHARE_S3_SECRET_KEY: ${{ secrets.NOOSHARE_S3_SECRET_KEY }}
          TONG_GZZX_KEY_HEX: ${{ secrets.TONG_GZZX_KEY_HEX }}
        run: python scripts/integration/tong_s3_to_pg.py
