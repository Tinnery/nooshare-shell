name: Test S3 Connection

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-s3:
    name: Test RustFS S3 Connection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install boto3
        run: pip install boto3
      
      - name: Test S3 connection
        env:
          NOOSHARE_S3_ENDPOINT: ${{ secrets.NOOSHARE_S3_ENDPOINT }}
          NOOSHARE_S3_ACCESS_KEY: ${{ secrets.NOOSHARE_S3_ACCESS_KEY }}
          NOOSHARE_S3_SECRET_KEY: ${{ secrets.NOOSHARE_S3_SECRET_KEY }}
        run: |
          python3 << 'EOF'
          import os
          import boto3
          from botocore.exceptions import ClientError, NoCredentialsError
          
          endpoint = os.environ.get("NOOSHARE_S3_ENDPOINT")
          access_key = os.environ.get("NOOSHARE_S3_ACCESS_KEY")
          secret_key = os.environ.get("NOOSHARE_S3_SECRET_KEY")
          
          print("Checking environment variables...")
          print(f"  NOOSHARE_S3_ENDPOINT: {'✓ set' if endpoint else '✗ missing'}")
          print(f"  NOOSHARE_S3_ACCESS_KEY: {'✓ set' if access_key else '✗ missing'}")
          print(f"  NOOSHARE_S3_SECRET_KEY: {'✓ set' if secret_key else '✗ missing'}")
          
          if not all([endpoint, access_key, secret_key]):
              print("\n❌ Some secrets are not configured")
              exit(1)
          
          print("\nAttempting to connect to S3...")
          try:
              s3 = boto3.client(
                  "s3",
                  endpoint_url=endpoint,
                  aws_access_key_id=access_key,
                  aws_secret_access_key=secret_key,
                  region_name="us-east-1",
              )
              
              # List buckets to verify connection
              response = s3.list_buckets()
              buckets = [b["Name"] for b in response.get("Buckets", [])]
              
              print(f"✓ Connected successfully!")
              print(f"  Found {len(buckets)} bucket(s): {', '.join(buckets[:5])}")
              
          except NoCredentialsError as e:
              print(f"❌ Credentials error: {e}")
              exit(1)
          except ClientError as e:
              error_code = e.response.get("Error", {}).get("Code", "Unknown")
              print(f"❌ S3 client error: {error_code}")
              exit(1)
          except Exception as e:
              print(f"❌ Unexpected error: {type(e).__name__}: {e}")
              exit(1)
          
          print("\n✅ S3 connection test passed!")
          EOF
