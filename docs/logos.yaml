schema_version: 1

project:
  name: nooshare-shell
  description: Public project shell and framework-independent Flow runtime.
  scope: >-
    Publishes project direction, Agent operating guidance, knowledge-system
    rules, and a minimal executable Flow runtime. The runtime provides a
    framework-independent execution boundary. It is not the complete
    application implementation or a mirror of internal development work.

resources:
  - path: LOGOS.md
    kind: knowledge-system-definition
    status: current
    authority: normative
    read_when: When first encountering the project, understand the boundaries, rules, authority, and maintenance principles of the Logos knowledge system.

  - path: VISION.md
    kind: vision
    status: current
    authority: direction
    read_when: When handling system goals, research positioning, autonomous permission boundaries, or knowledge evolution principles.
