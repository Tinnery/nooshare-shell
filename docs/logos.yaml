schema_version: 1

project:
  name: nooshare-shell
  description: Public-facing governance shell for the NooShare project.
  scope: >-
    Publishes selected project direction, Agent operating guidance, and
    knowledge-system rules. It is not the application implementation or a
    complete mirror of internal development work. Only intentionally approved
    public material belongs here.

resources:
  - path: LOGOS.md
    kind: knowledge-system-definition
    status: current
    authority: normative
    read_when: When first encountering the project, understand the boundaries, rules, authority, and maintenance principles of the Logos knowledge system.

  - path: VISION.md
    kind: vision
    status: current
    authority: direction
    read_when: When handling system goals, research positioning, autonomous permission boundaries, or knowledge evolution principles.
