[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashboard"
version = "0.1.0"
description = "NooShare knowledge browser and operations dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.0",
    "uvicorn>=0.34.0",
    "python-frontmatter>=1.0.0",
    "markdown-it-py>=3.0.0",
]

[project.scripts]
dashboard = "dashboard.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]
