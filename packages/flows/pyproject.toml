[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flows"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
flows = "flows.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
